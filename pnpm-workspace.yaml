packages:
  - "apps/*"
  - "packages/*"

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - i18next@26.3.6
  - posthog-js@1.399.0
  - react-i18next@17.0.9
  - vite@8.1.4
trustPolicy: no-downgrade

overrides:
  chokidar: 4.0.1
  esbuild: 0.28.1
  semver: 7.7.3
  # GHSA-g3hv-75wg-m249 is fixed only in minimatch 11; typedoc 0.28 (an optional orval peer this
  # project's codegen does not use) still asks for ^10.
  "typedoc>minimatch": ^11.0.1

onlyBuiltDependencies:
  - core-js
  - esbuild
